    <meta charset="UTF-8" />

    <meta property="og:title" content="Bullivant Base Flash Loan Arbitrage Hub" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress Vite HMR WebSocket connection errors and iframe clipboard rejections per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (
          msg.includes('WebSocket closed without opened') ||
          msg.includes('[vite]') ||
          msg.includes('failed to connect to websocket') ||
          msg.includes('Document is not focused') ||
          msg.includes('NotAllowedError') ||
          msg.includes('Clipboard')
        ) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && event.error.message) || String(event))) || '';
        if (
          msg.includes('WebSocket closed without opened') ||
          msg.includes('[vite]') ||
          msg.includes('failed to connect to websocket') ||
          msg.includes('Document is not focused') ||
          msg.includes('NotAllowedError') ||
          msg.includes('Clipboard')
        ) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-zinc-950 text-white min-h-screen">

  </body>
