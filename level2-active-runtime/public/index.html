<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Level 2: Active Runtime Debugger</title>
  <style>
    body { font-family: monospace; padding: 24px; background: #0f172a; color: #f8fafc; margin: 0; }
    h2 { color: #38bdf8; margin-top: 0; }
    .badge { background: #1e293b; color: #94a3b8; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .block { border: 1px solid #334155; margin: 16px 0; padding: 16px; border-radius: 8px; background: #1e293b; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    button { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: monospace; font-weight: bold; }
    button:hover { background: #0369a1; }
    pre { background: #090d16; padding: 12px; border-radius: 6px; overflow-x: auto; color: #e2e8f0; font-size: 13px; }
    .log-box { background: #000; color: #4ade80; padding: 12px; border-radius: 6px; margin-top: 10px; font-size: 12px; min-height: 28px; line-height: 1.5; }
    .stack-trace { color: #94a3b8; font-size: 10px; margin-left: 6px; }
  </style>
</head>
<body>
  <h2>Level 2: Static Docs &rarr; Interactive Workflow</h2>
  <p style="color: #94a3b8; font-size: 13px;">
    AST Extraction from <code>README.md</code> &bull; Server-Sent Events (SSE) Streaming &bull; Call Stack Tracing
  </p>
  <div id="app">Loading blocks from README.md...</div>

  <script>
    // Validation layer to check if a code block is syntactically valid
    function validateCodeSyntax(code, language) {
      const lang = (language || '').toLowerCase().trim();

      // JavaScript / Node.js Syntax Validation
      if (lang === 'javascript' || lang === 'js' || lang === 'node') {
        try {
          // Use Function constructor to validate syntactic structure without executing
          new Function(code);
          return { isValid: true, error: null };
        } catch (err) {
          return { isValid: false, error: err.message };
        }
      }

      // JSON Syntax Validation
      if (lang === 'json') {
        try {
          JSON.parse(code);
          return { isValid: true, error: null };
        } catch (err) {
          return { isValid: false, error: err.message };
        }
      }

      // Shell / Bash Syntax Validation (balancing quotes and delimiters)
      if (lang === 'bash' || lang === 'sh' || lang === 'shell') {
        const doubleQuotes = (code.match(/"/g) || []).length;
        if (doubleQuotes % 2 !== 0) {
          return { isValid: false, error: 'Syntax Error: Unmatched double quote (") in shell script' };
        }
        const singleQuotes = (code.match(/'/g) || []).length;
        if (singleQuotes % 2 !== 0) {
          return { isValid: false, error: "Syntax Error: Unmatched single quote (') in shell script" };
        }
        const backticks = (code.match(/`/g) || []).length;
        if (backticks % 2 !== 0) {
          return { isValid: false, error: 'Syntax Error: Unmatched backtick (`) in shell script' };
        }
        return { isValid: true, error: null };
      }

      return { isValid: true, error: null };
    }

    async function load() {
      try {
        const res = await fetch('/api/readme/blocks');
        const { blocks } = await res.json();

        // VALIDATION LAYER: Validate syntax of every block from README before execution
        const validatedBlocks = blocks.map(b => {
          const validation = validateCodeSyntax(b.code, b.language);
          return {
            ...b,
            isValidSyntax: validation.isValid,
            syntaxError: validation.error,
          };
        });

        document.getElementById('app').innerHTML = validatedBlocks.map(b => `
          <div class="block" id="block-${b.id}">
            <div class="header">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span class="badge">Language: <b>${b.language}</b> (${b.id})</span>
                ${b.isValidSyntax 
                  ? `<span class="badge" style="background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3);">&#10003; Syntactically Valid</span>`
                  : `<span class="badge" style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);">&#9888; Syntax Error</span>`
                }
              </div>
              <button 
                onclick="run('${b.id}')" 
                ${!b.isValidSyntax ? 'disabled style="opacity: 0.5; cursor: not-allowed; background: #64748b;"' : ''}
              >
                ${b.isValidSyntax ? '&#9654; Run (Stream SSE)' : '&#9888; Blocked (Syntax Error)'}
              </button>
            </div>
            ${!b.isValidSyntax ? `
              <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 8px;">
                <strong>Validation Layer Warning:</strong> ${escapeHtml(b.syntaxError || 'Invalid syntax detected')}
              </div>
            ` : ''}
            <pre>${escapeHtml(b.code)}</pre>
            <div id="log-${b.id}" class="log-box">
              ${b.isValidSyntax 
                ? 'Click [Run] to stream execution from VM sandbox...' 
                : '<span style="color: #f87171;">Validation Layer: Stream execution blocked because code block has syntax errors.</span>'
              }
            </div>
          </div>
        `).join('');

        window.blocks = validatedBlocks;
      } catch (err) {
        document.getElementById('app').innerHTML = `<div style="color: #f87171">Failed to load blocks: ${err.message}</div>`;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function run(id) {
      const b = window.blocks.find(x => x.id === id);
      const log = document.getElementById('log-' + id);

      // Pre-execution validation check: abort before attempting to stream if syntactically invalid
      if (!b.isValidSyntax) {
        log.innerHTML = `<div style="color: #f87171; font-weight: bold;">[Validation Layer] Pre-stream check failed: ${escapeHtml(b.syntaxError || 'Syntax error in code block')}. Stream execution aborted.</div>`;
        return;
      }

      log.innerHTML = '<div style="color: #38bdf8;">[connecting SSE stream...]</div>';

      try {
        const res = await fetch('/api/readme/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(b)
        });

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        log.innerHTML = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = dec.decode(value);
          chunk.split('\\n\\n').forEach(line => {
            if (line.includes('data:')) {
              try {
                const payload = JSON.parse(line.split('data: ')[1]);
                const stackFirst = payload.stack?.[0] ? `<span class="stack-trace">(${payload.stack[0]})</span>` : '';
                log.innerHTML += `<div>&gt; [${escapeHtml(String(payload.data))}] ${stackFirst}</div>`;
              } catch (_) {}
            }
          });
        }
      } catch (err) {
        log.innerHTML += `<div style="color: #f87171">&gt; Stream error: ${err.message}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
